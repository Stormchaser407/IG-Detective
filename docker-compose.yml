version: '3.9'

services:
  detective:
    build:
      context: .
      dockerfile: Dockerfile
    image: ig-detective:latest
    container_name: ig-detective
    
    # Interactive shell support
    stdin_open: true
    tty: true
    
    volumes:
      - detective-data:/app/data
    
    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    
    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  detective-data:
    driver: local

networks:
  default:
    driver: bridge
    name: ig-detective-network
